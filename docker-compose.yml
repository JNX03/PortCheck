version: '3.8'

services:
  thai-portfolio-analyzer:
    build: .
    container_name: thai-portfolio-analyzer
    ports:
      - "8000:8000"
    environment:
      - TYPHOON_API_KEY=${TYPHOON_API_KEY}
      - TYPHOON_API_URL=${TYPHOON_API_URL:-https://api.opentyphoon.ai/v1}
      - TYPHOON_MODEL=${TYPHOON_MODEL:-typhoon-v2.5-30b-a3b-instruct}
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
